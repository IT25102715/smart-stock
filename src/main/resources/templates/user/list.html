<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: pageHead('Users')}"></head>
<body>
<div class="app">
    <aside th:replace="~{fragments/layout :: sidebar('users')}"></aside>

    <main class="main">
        <div class="main__inner">

            <div class="page-head">
                <div>
                    <h1 class="page-title">Users</h1>
                    <p class="page-sub">People with access to the SmartStock portal.</p>
                </div>
                <a href="/users/new" class="sbtn sbtn--primary"><i data-lucide="plus"></i> New user</a>
            </div>

            <section class="panel">
                <div class="panel__head">
                    <h2 class="panel__title">All users</h2>
                    <span class="count" th:text="${#lists.size(users)} + ' records'">0 records</span>
                </div>

                <div class="table-scroll">
                    <table class="dtable">
                        <thead>
                        <tr>
                            <th>ID</th>
                            <th>Full name</th>
                            <th>Username</th>
                            <th>Email</th>
                            <th>Role</th>
                            <th class="t-right">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="user : ${users}">
                            <td class="t-id" th:text="${user.id}">1</td>
                            <td class="t-strong" th:text="${user.fullName != null and !user.fullName.isEmpty()} ? ${user.fullName} : '-'">Full name</td>
                            <td class="t-muted" th:text="${user.username}">Username</td>
                            <td class="t-muted" th:text="${user.email != null and !user.email.isEmpty()} ? ${user.email} : '-'">Email</td>
                            <td>
                                <span class="tag tag--brand" th:if="${user.role == 'ADMIN'}">Admin</span>
                                <span class="tag" th:if="${user.role == 'MANAGER'}">Manager</span>
                                <span class="tag" th:if="${user.role == 'STAFF'}">Staff</span>
                            </td>
                            <td>
                                <div class="row-actions">
                                    <a class="sbtn sbtn--icon" th:href="@{/users/edit/{id}(id=${user.id})}" title="Edit">
                                        <i data-lucide="pencil"></i>
                                    </a>
                                    <button type="button" class="sbtn sbtn--icon is-danger" title="Delete"
                                            data-confirm-delete
                                            th:data-url="@{/users/delete/{id}(id=${user.id})}"
                                            th:data-name="${user.username}">
                                        <i data-lucide="trash-2"></i>
                                    </button>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(users)}">
                            <td colspan="6">
                                <div class="empty">
                                    <i data-lucide="users"></i>
                                    <p class="empty__title">No users yet</p>
                                    <p class="empty__text">Add a user to give someone portal access.</p>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </section>

        </div>
    </main>
</div>

<div th:replace="~{fragments/layout :: confirmDelete('user')}"></div>
<th:block th:replace="~{fragments/layout :: scripts}"></th:block>
</body>
</html>
