<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <!--/* ===================== HEAD ===================== */-->
    <th:block th:fragment="pageHead(title)">
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title th:text="${title} + ' · SmartStock'">SmartStock</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://unpkg.com/lucide@latest"></script>
        <link href="/css/app.css" rel="stylesheet">
    </th:block>
</head>
<body>

<!--/* ===================== SIDEBAR ===================== */-->
<aside th:fragment="sidebar(active)" class="sidebar">
    <a href="/dashboard" class="sidebar__brand">
        <span class="sidebar__mark"><i data-lucide="layers"></i></span>
        <span>SmartStock</span>
    </a>

    <nav class="sidebar__nav">
        <div class="navgroup">
            <div class="navgroup__label">Overview</div>
            <a href="/dashboard" class="navlink" th:classappend="${active == 'dashboard'} ? 'is-active'">
                <i data-lucide="layout-dashboard"></i> Dashboard
            </a>
        </div>

        <div class="navgroup">
            <div class="navgroup__label">Catalog</div>
            <a href="/products" class="navlink" th:classappend="${active == 'products'} ? 'is-active'">
                <i data-lucide="package"></i> Products
            </a>
            <a href="/categories" class="navlink" th:classappend="${active == 'categories'} ? 'is-active'">
                <i data-lucide="tags"></i> Categories
            </a>
            <a href="/suppliers" class="navlink" th:classappend="${active == 'suppliers'} ? 'is-active'">
                <i data-lucide="truck"></i> Suppliers
            </a>
        </div>

        <div class="navgroup">
            <div class="navgroup__label">Operations</div>
            <a href="/purchases" class="navlink" th:classappend="${active == 'purchases'} ? 'is-active'">
                <i data-lucide="shopping-cart"></i> Purchases
            </a>
            <a href="/stocks" class="navlink" th:classappend="${active == 'stocks'} ? 'is-active'">
                <i data-lucide="warehouse"></i> Stock movements
            </a>
        </div>

        <div class="navgroup">
            <div class="navgroup__label">Administration</div>
            <a href="/users" class="navlink" th:classappend="${active == 'users'} ? 'is-active'">
                <i data-lucide="users"></i> Users
            </a>
        </div>
    </nav>

    <div class="sidebar__foot">
        <div class="sidebar__user" th:if="${session.username != null}">
            <span class="sidebar__user-label">Signed in as</span>
            <span class="sidebar__user-name" th:text="${session.username}">admin</span>
            <span class="sidebar__user-role" th:if="${session.role != null}" th:text="${session.role}">ADMIN</span>
        </div>
        <a href="/logout" class="navlink">
            <i data-lucide="log-out"></i> Sign out
        </a>
    </div>
</aside>

<!--/* ===================== DELETE CONFIRMATION MODAL =====================
     Rendered once per list page. Any button carrying data-confirm-delete
     opens it, and passes its own delete URL + record name across.
     ==================================================================== */-->
<div th:fragment="confirmDelete(entity)" class="modal fade" id="confirmDeleteModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content confirm">
            <div class="confirm__body">
                <div class="confirm__icon"><i data-lucide="trash-2"></i></div>
                <h2 class="confirm__title" th:text="'Delete this ' + ${entity} + '?'">Delete this record?</h2>
                <p class="confirm__text">
                    <strong id="confirmDeleteName">This record</strong>
                    will be permanently removed. This action cannot be undone.
                </p>
            </div>
            <div class="confirm__foot">
                <button type="button" class="sbtn sbtn--default" data-bs-dismiss="modal">Cancel</button>
                <a href="#" id="confirmDeleteAction" class="sbtn sbtn--danger">
                    <i data-lucide="trash-2"></i> Delete
                </a>
            </div>
        </div>
    </div>
</div>

<!--/* ===================== SCRIPTS ===================== */-->
<th:block th:fragment="scripts">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        lucide.createIcons();

        document.addEventListener('DOMContentLoaded', function () {
            var modalEl = document.getElementById('confirmDeleteModal');
            if (!modalEl) {
                return;
            }

            var modal = new bootstrap.Modal(modalEl);
            var nameEl = document.getElementById('confirmDeleteName');
            var actionEl = document.getElementById('confirmDeleteAction');

            document.querySelectorAll('[data-confirm-delete]').forEach(function (trigger) {
                trigger.addEventListener('click', function () {
                    nameEl.textContent = trigger.getAttribute('data-name') || 'This record';
                    actionEl.setAttribute('href', trigger.getAttribute('data-url'));
                    modal.show();
                });
            });
        });
    </script>
</th:block>

</body>
</html>
