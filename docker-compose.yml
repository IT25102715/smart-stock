services:
  mysql:
    image: mysql:8.4
    container_name: smartstock-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: smartstock_db
    ports:
      - "3307:3306"
    volumes:
      - smartstock-mysql-data:/var/lib/mysql

volumes:
  smartstock-mysql-data:
